[package]
name = "keel-decl"
description = "Record format and binary reader for test declarations stored in the .keel link section"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
object = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The writer is only needed to build tiny ELF / Mach-O / COFF inputs for the
# reader's unit tests; the shipped reader needs read only.
object = { workspace = true, features = ["write"] }
proptest = { workspace = true }
serde_json = { workspace = true }
