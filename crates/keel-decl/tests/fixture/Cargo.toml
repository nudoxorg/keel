# Compiled by tests/fixture_binary.rs, never as part of the repo workspace;
# the empty [workspace] table keeps cargo from adopting it into the root one.
[package]
name = "keel-fixture"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
keel-macros = { path = "../../../keel-macros" }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
rstest = { version = "0.26", default-features = false }
