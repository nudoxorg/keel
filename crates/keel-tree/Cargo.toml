[package]
name = "keel-tree"
description = "Joins the Nix product model, the code index and the inference core: resolves ownership, derives what each node stands on, and answers check, tree, plan and explain against a real repository"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "keel-tree"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
globset = { workspace = true }
keel-index = { path = "../keel-index" }
keel-infer = { path = "../keel-infer" }
keel-settle = { path = "../keel-settle" }
roaring = { workspace = true }
rustix = { workspace = true, features = ["process"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Pattern selectors are matched by ast-grep over tree-sitter, so one engine serves every
# language the backend holds. Only the grammars the product is polyglot in are compiled in.
ast-grep-core = "0.51"
memchr = "2"
ast-grep-language = { version = "0.51", default-features = false, features = [
    "tree-sitter-bash", "tree-sitter-c", "tree-sitter-c-sharp", "tree-sitter-cpp", "tree-sitter-css",
    "tree-sitter-go", "tree-sitter-html", "tree-sitter-java", "tree-sitter-javascript",
    "tree-sitter-json", "tree-sitter-nix", "tree-sitter-python", "tree-sitter-ruby",
    "tree-sitter-rust", "tree-sitter-swift", "tree-sitter-typescript", "tree-sitter-yaml",
] }
rayon = { workspace = true }
sha2 = "0.10"
# nextest's JUnit, the one results file a lane writes that also lists every pass.
roxmltree = "0.21"

[dev-dependencies]
tempfile = "3"
