[package]
name = "keel-judge"
description = "Keel idle-loop supervisor (design/doubt.md section 5.6): keeps libFuzzer targets running in quanta, picks the next by an index, and records everything it observes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

[lib]
name = "keel_judge"
path = "src/lib.rs"

[[bin]]
name = "keel-judge"
path = "src/main.rs"

# Exists only for the integration tests and the NixOS VM test.
[[bin]]
name = "keel-judge-test-target"
path = "src/bin/test_target.rs"

[dependencies]
keel-tree = { path = "../keel-tree" }
anyhow = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true }
humantime = { workspace = true }
libc = { workspace = true }
rustc-demangle = { workspace = true }
sd-notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
