[package]
name = "keel"
description = "Keel core: node graph, input keys, verdicts, report documents and the local result store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3 = { workspace = true }
camino = { workspace = true }
globset = { workspace = true }
ignore = { workspace = true }
object = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smol_str = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The writer builds tiny ELF / Mach-O / COFF inputs for the section-selection
# tests; the shipped reader needs read only.
object = { workspace = true, features = ["write"] }
proptest = { workspace = true }
