[package]
name = "keel-reach"
description = "Per-test reach key: link-input capture shim, symbolic link, relocation graph, Merkle hashes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "keel_reach"

[[bin]]
name = "keel-linker"
path = "src/bin/keel-linker.rs"

[[bin]]
name = "keel-reach"
path = "src/bin/keel-reach.rs"

[dependencies]
anyhow = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true }
memmap2 = { workspace = true }
libc = "0.2"
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }
object = { workspace = true }
rayon = { workspace = true }
roaring = { workspace = true }
rustc-demangle = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zstd = "0.13"
regex = "1"
thiserror = { workspace = true }

[dev-dependencies]
object = { workspace = true, features = ["write"] }
