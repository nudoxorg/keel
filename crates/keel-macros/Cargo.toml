[package]
name = "keel-macros"
description = "stands_on and joins attributes that record test edges in the .keel link section"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[dependencies]
# Shared with the reader so the writer and the reader cannot disagree about
# the record layout or about what a valid entry looks like.
keel-decl = { path = "../keel-decl" }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
trybuild = { workspace = true }
